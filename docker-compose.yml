services:
  nginx:
    image: nginx:latest
    container_name: ourstory_nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - koa
    networks:
      - ourstory
    restart: always

  koa:
    image: node:22-alpine
    container_name: ourstory_koa
    working_dir: /app
    command: sh -c "npm install -g pnpm@11.28.5 && pnpm install --prod --frozen-lockfile && node server/index.js"
    expose:
      - "3000"
    volumes:
      - ./server:/app/server
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOVE_PASSCODE: "${LOVE_PASSCODE:?Set LOVE_PASSCODE in .env before starting}"
    networks:
      - ourstory
    init: true
    restart: always

networks:
  ourstory:
    driver: bridge
